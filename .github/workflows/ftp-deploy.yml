name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - master
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftpupload.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/lottery/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/__pycache__/**
          **/*.log
          # Los scripts del VPS no pintan nada en el hosting público.
          **/*.py
          **/*.sh
          # Credenciales: se suben a mano una sola vez y no se tocan.
          secrets.php
          secrets.example.php
          .env
          # Datos generados: los sube el VPS por FTP, no el deploy.
          db_backup.json
          historial_*.txt
          *.flag
          local_*
          README.md
