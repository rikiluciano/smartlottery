name: Desplegar al hosting

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  # Dos despliegues simultáneos por FTP dejarían el sitio a medias.
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  desplegar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la hoja de estilos
        run: npm run build:css

      - name: Comprobar que el CSS se generó
        run: test -s assets/css/app.css

      - name: Publicar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'ftpupload.net' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/lottery/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/__pycache__/**
            **/.venv/**
            **/*.log
            # Los scripts del VPS no se ejecutan en el hosting.
            vps/**
            scripts/**
            tests/**
            # Fuentes de compilación: solo viaja el CSS ya generado.
            assets/css/tailwind.src.css
            tailwind.config.js
            package.json
            package-lock.json
            # Credenciales: se suben a mano una vez y no se versionan.
            secrets.php
            secrets.example.php
            .env
            # Datos generados: los publica el VPS por FTP, no el despliegue.
            # Excluirlos es IMPRESCINDIBLE: varios estuvieron versionados, y sin
            # esta lista el despliegue los borraría del servidor al no
            # encontrarlos ya en el repositorio. La web se quedaría sin datos
            # hasta la siguiente tanda de resultados nuevos.
            db_backup.json
            db_dump.json
            prediccion.json
            prediccion_quinielas.json
            super_prediccion.json
            stats_quinielas.json
            resultados_pendientes.json
            history_*.json
            historial_*.txt
            tripletas.txt
            auditoria_pales.txt
            pales_encontrados.txt
            super_pales_encontrados.txt
            *.flag
            local_*
            debug_*.txt
            README.md
